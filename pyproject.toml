[project]
name = "nwis-canonical"
version = "0.2.0"
description = "Canonical, provenance-tracked dataset and read API for FORGE 16B(78)-32"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.8",
    "ruff>=0.4",
    "pyyaml>=6.0",
]
# The modelling extra. scikit-learn is not a base dependency: the canonical
# dataset and the read API do not use it, and tests/test_ml_scaffolding.py
# fails the build if it appears in the base install. Install with `pip install -e .[ml]`.
# xgboost and lightgbm are here for the gradient-boosted stage; they are not base
# dependencies either, and nothing in the canonical pipeline imports them.
ml = [
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "joblib>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "scripts/api", "data/ml/common"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: re-derives an artifact from the full source; deselect with -m 'not slow'",
]

[tool.mypy]
python_version = "3.11"
files = [
    "scripts/nwis_lib.py",
    "scripts/api",
    "scripts/reports",
    "scripts/ingest/extract_force2020_penalty_matrix.py",
    "data/ml/common",
    "data/ml/lithology/training",
    "data/ml/lithology/evaluation",
    "tests",
]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["nwis_lib", "nwis_api"]
ignore_errors = false

# The modelling stage declares scikit-learn as an optional extra, so the types
# come from the package when it is installed and are stubbed out when it is not.
# xgboost and lightgbm are in the same position and are treated the same way: both
# ship py.typed, and walking their source costs a lot and (with mypy 1.13 on
# Windows) crashes the cache writer on an integer literal inside lightgbm.
[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "xgboost.*", "lightgbm.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/api/*" = ["E402"]
"scripts/reports/*" = ["E402"]
"data/ml/*" = ["E402"]
