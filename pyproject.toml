[project]
name = "nwis-canonical"
version = "0.2.0"
description = "Canonical, provenance-tracked dataset and read API for FORGE 16B(78)-32"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.8",
    "ruff>=0.4",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "scripts/api"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
files = ["scripts/nwis_lib.py", "scripts/api", "scripts/reports", "tests"]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["nwis_lib", "nwis_api"]
ignore_errors = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/api/*" = ["E402"]
"scripts/reports/*" = ["E402"]
